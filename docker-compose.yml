name: reliable-queue
x-runtime: &runtime
  DATABASE_URL: postgresql://rq_user:${POSTGRES_PASSWORD:-rq_password}@postgres:5432/reliable_queue
  REDIS_URL: redis://redis:6379
  NODE_ENV: development
  HOST: 0.0.0.0
  ADMIN_USER: ${ADMIN_USER:-admin}
  ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
  TRUST_PROXY: 'false'
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: rq_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rq_password}
      POSTGRES_DB: reliable_queue
    ports: ['127.0.0.1:5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rq_user -d reliable_queue']
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ['127.0.0.1:6380:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
  migrate:
    build: { context: ., args: { PACKAGE_NAME: api } }
    command: ['node', 'packages/infrastructure/dist/cli.js', 'migrate']
    environment: *runtime
    depends_on:
      postgres: { condition: service_healthy }
  api:
    build: { context: ., args: { PACKAGE_NAME: api } }
    ports: ['127.0.0.1:3000:3000']
    environment:
      <<: *runtime
      PORT: '3000'
    depends_on:
      migrate: { condition: service_completed_successfully }
  worker:
    build: { context: ., args: { PACKAGE_NAME: worker } }
    environment:
      <<: *runtime
      PORT: '3002'
      QUEUE_NAME: ${QUEUE_NAME:-default}
      WORKER_CONCURRENCY: '5'
      DEMO_MODE: ${DEMO_MODE:-true}
      HANDLER_MODULE: ${HANDLER_MODULE:-}
    stop_grace_period: 45s
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
  dispatcher:
    build: { context: ., args: { PACKAGE_NAME: dispatcher } }
    environment:
      <<: *runtime
      PORT: '3003'
    stop_grace_period: 45s
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
  dashboard:
    build: { context: ., args: { PACKAGE_NAME: dashboard } }
    ports: ['127.0.0.1:3001:3001']
    environment:
      <<: *runtime
      PORT: '3001'
    depends_on:
      migrate: { condition: service_completed_successfully }
volumes:
  pgdata:
